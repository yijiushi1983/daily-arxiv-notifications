name: Arxiv Daily

on:
  schedule:
    # 每 3 小时运行一次；包含北京时间 21:30
    # UTC: 01:30, 04:30, 07:30, 10:30, 13:30, 16:30, 19:30, 22:30
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate arXiv mail content
        run: |
          python -u main.py
          test -f mail.html
          echo "mail.html generated successfully"

      - name: Send mail
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Arxiv Geo-Physics Papers Daily
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          html_body: file://mail.html
          convert_markdown: true
          priority: low
